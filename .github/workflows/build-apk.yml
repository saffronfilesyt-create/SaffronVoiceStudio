name: Build VC Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Android voice engine
        run: |
          git clone --depth 1 https://github.com/The-unknown-Shadowman/PocketTTS-Android-Engine.git engine

      - name: Prepare native engine
        working-directory: engine
        run: |
          chmod +x scripts/prepare_android_native_deps.sh
          ./scripts/prepare_android_native_deps.sh

      - name: Build APK
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output
          cp engine/app/build/outputs/apk/debug/app-debug.apk output/VC-VoiceEngine-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VC-VoiceEngine-Test
          path: output/VC-VoiceEngine-Test.apk
